# Dataset kaynakları tek noktadan yönetilsin diye.
# İndirme script'i: tools/datasets/download_roboflow.py
#
# Notlar:
# - Her kaynak kendi klasörüne iner (datasets/raw/<name>/)
# - "format": roboflow python SDK'nın desteklediği export formatı (örn: yolov8)
# - API key'i repo'ya yazma. Ortam değişkeni kullan: ROBOFLOW_API_KEY
#
# Canonical hedef sınıflar:
#   apron, goggles, haircap (hairnet/bone), mask, gloves

roboflow:
  # Örnek (repo içindeki mevcut food datasetinin kaynağı)
  - name: ppe_food_manufacturing_v5
    workspace: rahma-5lrz6
    project: ppe-food-manufacturing
    version: 5
    format: yolov8

  # Hashem — small food-PPE set (~367 imgs). Universe: https://universe.roboflow.com/hashem-xyi2s/ppe-food-manufacturing-phttq
  # If download fails, open the project's "Dataset" tab and set `version` to the latest export id.
  - name: ppe_food_hashem
    workspace: hashem-xyi2s
    project: ppe-food-manufacturing-phttq
    version: 1
    format: yolov8

  # IDP - FinalDataset-Version2 (endüstriyel hacim)  [opsiyonel: manuel indiriyorsan eklemeyebilirsin]
  - name: idp_v2_finaldataset_v12
    # Universe URL: https://universe.roboflow.com/idp-kwqac/finaldataset-version2
    workspace: idp-kwqac
    project: finaldataset-version2
    version: 12
    # SDK uyumluluğu için güvenli seçim; YOLO11 ile eğitmeye engel değildir.
    format: yolov8

  # 2. Safety Food System (Gerçek Food Context - ~10k Görüntü)
  # Hashem yerine gelen, Apron ve Haircap için uzmanlaşmış devasa set.
  - name: food_ppe_safety_system
    workspace: safety-food-system
    project: safety-food
    version: 1
    format: yolov8

  # CPPE-5 mirror (Roboflow Universe — may rot). Prefer HF: tools/datasets/download_cppe5_hf.py -> datasets/raw/cppe5_hf/
  - name: cppe5_mirror_v4
    workspace: vishwa-sharma-itcln
    project: cppe-5-ppe-detection
    version: 4
    format: yolov8

# Hugging Face (not consumed by download_roboflow.py; documented for humans / CI)
# CPPE-5 canonical: https://huggingface.co/datasets/xuan-yuan/cppe-5
#   python tools/datasets/download_cppe5_hf.py --clean
# Optional Roboflow fallback slug (if you insist on zip): workspace muhammad-amin-shahid / project ppe-5 / version 1

