# SmartSafe AI Ekosistemi - Local Dev Setup
services:
  # 🐍 Flask Backend (Core)
  core:
    build:
      context: ..
      # GPU: infra/Dockerfile.core.cuda. GPU’suz makinede Compose hata verirse: dockerfile → Dockerfile.core, gpus satırını silin.
      dockerfile: infra/Dockerfile.core.cuda
    container_name: smartsafe-core
    ports:
      - "5577:5577"
    # Docker Desktop (WSL2) + NVIDIA sürücü: Core konteynerine GPU geçirir.
    gpus: all
    volumes:
      - ../core:/app
      - ../storage:/app/storage
    environment:
      - ENV=local
      - FLASK_ENV=development
      - PORT=5577
      - PYTHONPATH=.
      - PYTHONDONTWRITEBYTECODE=1
      # Bind mount (özellikle Docker Desktop / Windows): inotify güvenilir değil; stat reloader sıklığı
      - FLASK_RELOADER_INTERVAL=0.75
      - DATABASE_URL=postgres://smartsafe:smartsafe2024@postgres:5432/smartsafe_saas?sslmode=disable
      # Flask-Limiter: Redis DB 1 (ayrı index; diğer Redis kullanımlarıyla çakışmayı azaltır)
      - RATELIMIT_STORAGE_URI=redis://redis:6379/1
      - YOLO_CONFIG_DIR=/tmp
      # Torch: auto | cpu | cuda | cuda:N — core/utils/torch_device.py (RENDER=1 iken her zaman cpu)
      - TORCH_DEVICE=auto
      # Opsiyonel gözlemlenebilirlik (core/utils/detection_observability.py + ROI_DEBUG app.py):
      # - DETECTION_OBSERVABILITY_BANNER=1   # worker başında env özeti + saha testi checklist logu
      # - DETECTION_LATENCY_SUMMARY_SEC=60 # periyodik avg/min/max inference ms (0=kapalı)
      # - ROI_DEBUG=1                      # video-feed’te ROI poligonu + yeşil/kırmızı kişi kutuları
      # - ROI_LOG_INTERVAL_SEC=15          # ROI INFO log seyrekleştirme (varsayılan 15)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5577/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ⚛️ Next.js Frontend
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: smartsafe-frontend
    ports:
      - "3377:3377"
    volumes:
      - ../frontend:/app
      - ../storage:/app/public/storage
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5577
      - NODE_ENV=development
      - WATCHPACK_POLLING=1000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      core:
        condition: service_healthy
      backend:
        condition: service_started

  # ⚡ Encore Backend (Microservices)
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: smartsafe-backend-encore
    ports:
      - "4477:4477"
      - "9400:9400"
    volumes:
      - ../backend:/app
      - ../storage:/app/storage
      - /app/node_modules
    environment:
      - ENCORE_ENV=local
      - DATABASE_URL=postgres://smartsafe:smartsafe2024@postgres:5432/smartsafe_saas?sslmode=disable
      - ENCORE_DEVDASH_LISTEN_ADDR=0.0.0.0:9400
      # Bind mount üzerinde dosya izleme (frontend ile aynı mantık): polling ile tetikle
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=1000
      # TypeScript/Encore tarafında polling fallback (Docker volume)
      - TSC_WATCHFILE=UseFsEventsWithFallbackDynamicPolling
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 🐘 PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartsafe-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartsafe_saas
      - POSTGRES_USER=smartsafe
      - POSTGRES_PASSWORD=smartsafe2024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsafe -d smartsafe_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 🌐 CloudBeaver (Modern Database Dashboard)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: smartsafe-cloudbeaver
    restart: unless-stopped
    ports:
      - "5052:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

  # 🔍 PgWeb (Database Browser) - Opsiyonel olarak tutuyoruz, istenirse tamamen silinebilir
  pgweb:
    image: sosedoff/pgweb
    container_name: smartsafe-pgweb
    restart: unless-stopped
    ports:
      - "5051:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://smartsafe:smartsafe2024@postgres:5432/smartsafe_saas?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # 🔴 Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartsafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 🎯 SmartSafe Developer Hub (Port Hub)
  hub:
    image: nginx:alpine
    container_name: smartsafe-hub
    ports:
      - "8080:80"
    volumes:
      - ./hub/index.html:/usr/share/nginx/html/index.html
    depends_on:
      core:
        condition: service_healthy
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  cloudbeaver_data:

networks:
  default:
    name: smartsafe-network
