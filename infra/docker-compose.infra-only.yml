# SmartSafe AI - Hafif Geliştirme Altyapısı (Sadece DB & Redis)
name: smartsafe-local
services:
  # 🐘 PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartsafe-postgres-local
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartsafe_saas
      - POSTGRES_USER=smartsafe
      - POSTGRES_PASSWORD=smartsafe2024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsafe -d smartsafe_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 🔴 Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartsafe-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 🕸️ PGWeb (Database UI)
  pgweb:
    image: sosedoff/pgweb
    container_name: smartsafe-pgweb-local
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://smartsafe:smartsafe2024@postgres:5432/smartsafe_saas?sslmode=disable
    depends_on:
      - postgres

volumes:
  postgres_data_local:
  redis_data_local:

networks:
  default:
    name: smartsafe-local-network
